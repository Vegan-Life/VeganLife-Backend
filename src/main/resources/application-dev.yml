spring:
  config:
    activate:
      on-profile: dev
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: ${MARIA_URL}
    username: ${MARIA_USER}
    password: ${MARIA_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  cloud:
    gcp:
      storage:
        project-id: ${GCP_PROJECT_ID}
        bucket: ${BUCKET_NAME}
logging:
  level:
    com.konggogi.veganlife: info
